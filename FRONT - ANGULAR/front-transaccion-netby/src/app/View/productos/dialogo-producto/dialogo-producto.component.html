<header mat-dialog-title class="encabezado-dialogo">
  <h2>{{ esEdicion ? "Editar producto" : "Agregar producto" }}</h2>
  <button type="button" (click)="cancelar()" aria-label="Cerrar">
    <mat-icon>close</mat-icon>
  </button>
</header>

<form [formGroup]="formulario" (ngSubmit)="guardar()">
  <mat-dialog-content>
    <div class="campos-formulario">
      <label>Nombre<input formControlName="nombre" /></label>
      <label>Categoría<input formControlName="categoria" /></label>
      <label class="campo-completo"
        >Descripción<textarea formControlName="descripcion" rows="3"></textarea>
      </label>
      <label
        >Precio unitario<input
          formControlName="precioUnitario"
          type="number"
          min="0"
          step="0.01"
      /></label>
      <label
        >Stock<input formControlName="stock" type="number" min="0" step="1"
      /></label>
      <label class="campo-completo"
        >URL de imagen<input
          formControlName="urlImagen"
          type="url"
          placeholder="https://..."
      /></label>
      <label class="selector-estado"
        >Estado<select formControlName="estado">
          <option [ngValue]="true">Activo</option>
          <option [ngValue]="false">Inactivo</option>
        </select></label
      >
    </div>
    <p class="validacion" *ngIf="formulario.invalid && formulario.touched">
      Completa los campos requeridos y verifica los valores.
    </p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button class="boton limpiar" type="button" (click)="cancelar()">
      Cancelar
    </button>
    <button class="boton primario" type="submit">
      <mat-icon>save</mat-icon>Guardar
    </button>
  </mat-dialog-actions>
</form>
